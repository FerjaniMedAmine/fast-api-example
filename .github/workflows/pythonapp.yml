name: Python Application Test

on:
  push:
    branches: [ "dev","main" ]
  pull_request:
    branches: [ "dev","main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10","3.11","3.12","3.13"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
            cd src 
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - name: Lint with flake8
        run: |
            pip install flake8
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics 2>&1 | tee flake8_output.txt
            flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics 2>&1 | tee -a flake8_output.txt

      - name: Test with pytest
        run: |
          pip install pytest
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          pytest src 2>&1 | tee pytest_output.txt

      - name: Combine logs
        if: matrix.python-version == '3.12'
        run: cat flake8_output.txt pytest_output.txt > raw_log.txt

      - name: Install agent dependencies
        if: matrix.python-version == '3.12'
        run: pip install -r src/requirements.txt

      - name: Debug check key presence
        if: matrix.python-version == '3.12'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "GOOGLE_API_KEY is EMPTY or missing"
          else
            echo "GOOGLE_API_KEY is set, length: ${#GOOGLE_API_KEY}"
          fi

      - name: Run log analysis agent
        if: matrix.python-version == '3.12'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python src/agent.py raw_log.txt

      - name: Upload report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-report
          path: report.md